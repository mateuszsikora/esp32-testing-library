# LilyGO T-A7670G R2. The modem's route and lines are the specification's (issue #1), with the
# pull-down on RI that stage 0 found. GNSS, SD and the other controls follow LilyGO's ESP32
# pin table and ExternalGPS_A7670G_Only example at 63af963038e93c91baf39d89a3a736d6bc26ff13.
# Sources and unresolved R2/revision differences: docs/features/board-profiles-technical.md.
name = "lilygo-t-a7670g-r2"
chip = "esp32"            # ESP32-WROVER-E
flash_mb = 4              # 4MB (Quad-SPI), LilyGO's product table
psram_mb = 4              # the WROVER-E carries 8 MB; esp32sim models 0 or 4

# The A7670G modem.
[uart.modem]
port = 1
tx = 26                   # ESP32 TX → modem RX
rx = 27
baud = 115200

# The L76K receiver of the A7670G with GPS, an external module: Serial2 in LilyGO's example.
[uart.gnss]
port = 2
tx = 21                   # ESP32 TX → receiver RX
rx = 22
baud = 9600

[lines.modem]
# ESP32 pad polarity from LilyGO; model thresholds from SIMCom (see modem-user.md).
pwrkey = { pin = 4, active = 1, on_ms = 50, off_ms = 2500 }
ri = { pin = 33, pull = "down" }   # pulled down on the board: docs/stage0-findings.md, gap 6
# A named GPIO only: no modeled sleep effect, no assumed pull or pulse timing.
dtr = 25
# ESP32 pad polarity from LilyGO; the model's threshold is SIMCom's minimum (see modem-user.md).
reset = { pin = 5, active = 1, pulse_ms = 2000 }

[lines.gnss]
wake = 19                 # receiver wake/standby control; no modeled effect
pps = 23                  # receiver pulse output; no automatic PPS generation

[lines.board]
power_enable = 12         # peripheral supply control; no modeled power gating

[sd_card]
sclk = 14
mosi = 15
miso = 2
cs = 13
