# LilyGO T-A7670G R2. Only what the specification (issue #1) gives, and the pull-down on RI that
# stage 0 found; nothing from memory (plan §4.5, finding 12). The other pins, the flash and PSRAM
# sizes, and whether the board has a GNSS route at all, wait for the vendor schematic.
name = "lilygo-t-a7670g-r2"
chip = "esp32"            # ESP32-WROVER-E

# The A7670G modem.
[uart.modem]
port = 1
tx = 26                   # ESP32 TX → modem RX
rx = 27
baud = 115200

[lines.modem]
pwrkey = 4
ri = { pin = 33, pull = "down" }   # pulled down on the board: docs/stage0-findings.md, gap 6
