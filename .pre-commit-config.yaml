repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml
  # ruff and mypy run from the venv that `make setup` creates, so their
  # versions and mypy's view of the dependencies come from pyproject.toml only.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        # The config lists the files to check; checking the whole tree each
        # time keeps the hook and `make lint` in agreement.
        entry: .venv/bin/mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
