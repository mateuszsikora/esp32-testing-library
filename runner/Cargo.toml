[package]
name = "esp32tl-runner"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Runs an unmodified ESP32 image in esp32sim with the esp32tl harness attached"
publish = false
# The real minimum, for a toolchain that ignores rust-toolchain.toml (one not
# from rustup): esp-soc calls `AtomicUsize::try_update`, stable since 1.95.
rust-version = "1.95"

# esp32sim is not on crates.io, so its crates come from git, every one at the
# same revision: afcfba6, the merge of mikroverk/esp32sim#336, with which deep
# sleep wakes on its RTC timer (stage 0, gap 4); images built for chip revision
# v3.0 boot from mikroverk/esp32sim#322 on. This revision is the project's
# esp32sim pin; changing it here changes it everywhere.
[dependencies]
esp32 = { git = "https://github.com/mikroverk/esp32sim", rev = "afcfba65da0da30a35fb0a7c381854c62b92e338" }
esp-soc = { git = "https://github.com/mikroverk/esp32sim", rev = "afcfba65da0da30a35fb0a7c381854c62b92e338" }
# For the SD card's image: esp32sim's `SdStore` and its write-through `FileStore`.
esp-periph = { git = "https://github.com/mikroverk/esp32sim", rev = "afcfba65da0da30a35fb0a7c381854c62b92e338" }
# SIGTERM and SIGINT end a run with `stats` (docs/protocol.md, section 9); std
# has no way to handle a signal.
signal-hook = { version = "0.4.5", default-features = false }

# For `Stop::CostModelLifecycle` in a test; neither crate above re-exports it.
[dev-dependencies]
emu-core = { git = "https://github.com/mikroverk/esp32sim", rev = "afcfba65da0da30a35fb0a7c381854c62b92e338" }

# What tests run. Dependencies take their profile from here, not from esp32sim's
# workspace, so this copies upstream's release profile: the emulator's speed
# depends on it.
[profile.release]
opt-level = 3
debug = 1
lto = "fat"
codegen-units = 1

# For local iteration (`make build-runner RUNNER_PROFILE=dev`): after a change to
# the runner, a release build links everything again with fat LTO, about 10 s
# on an M2 Pro against 0.3 s in dev. Optimised all the same, because an
# unoptimised emulator is too slow to boot an image. Upstream builds and tests
# only in release, so overflow checks and debug assertions stay off, as there.
[profile.dev]
opt-level = 3
debug-assertions = false
overflow-checks = false
