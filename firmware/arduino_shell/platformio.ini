; The Arduino-ESP32 validation image (docs/features/validation-firmware-user.md). firmware/build-platformio.sh
; builds it in its pinned container into firmware/arduino_shell/.pio/build/esp32dev/; the platform is
; pinned by its release URL here, and PlatformIO by the script.
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
