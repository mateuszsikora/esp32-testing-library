; The Arduino-ESP32 validation image (docs/features/validation-firmware-user.md). firmware/build-platformio.sh
; builds it in its pinned container into firmware/arduino_shell/.pio/build/<env>/; the platform is
; pinned by its release URL here, once for every environment, and PlatformIO by the script.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

; The same sketch on an ESP32-S3 whose `Serial` is the core's HWCDC, on the chip's USB-Serial/JTAG
; controller, as on a board without a USB-to-UART bridge: firmware/build-platformio.sh
; arduino_shell@esp32s3_usb builds it into .pio/build/esp32s3_usb/.
[env:esp32s3_usb]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
