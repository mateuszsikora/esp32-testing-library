[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "esp32tl"
version = "0.1.0"
description = "Test unmodified ESP32 firmware through its wires, on the esp32sim emulator or a real board."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# pytest-embedded declares no extras, so its services are separate packages
# (plan §3, "Distribution"). The `serial` extra of pytest-embedded-idf pulls
# pytest-embedded-serial-esp and, through it, pytest-embedded-serial.
# pytest-timeout ends a test whose run hangs: the runner waits for the test for as long as its body
# runs, so the plugin gives every test that uses `board` a wall-time timeout.
# bumble is the Bluetooth stack of the peers in esp32tl.bluetooth; pinned exactly, because at
# 0.0.x any release may change the internals esp32tl/bluetooth/controller.py and peer.py replace.
dependencies = [
    "bumble==0.0.236",
    "esp-idf-nvs-partition-gen==0.3.0",
    "pytest>=8",
    "pytest-embedded~=2.9.3",
    "pytest-embedded-idf[serial]~=2.9.3",
    "pytest-timeout>=2.3",
]

[project.optional-dependencies]
# esptool is imported by the tests; it comes through pytest-embedded-idf[serial] too, which also
# chooses its version.
dev = [
    "esptool",
    "mypy==2.4.1",
    "pre-commit>=4",
    "ruff==0.17.3",
    "types-pexpect==4.9.0.20260518",
]

[project.scripts]
esp32tl = "esp32tl.cli:main"

# esp32tl ships its own pytest plugin: pytest-embedded resolves
# `--embedded-services` through a closed dictionary and cannot load a
# third-party service (plan §1, finding 1).
[project.entry-points.pytest11]
esp32tl = "esp32tl.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["esp32tl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
# tests/conftest.py skips these where Docker, or mtools, is absent.
markers = [
    "requires_docker: needs a Docker daemon",
    "requires_mtools: needs mtools (mformat, mcopy, mdir, mtype)",
]
filterwarnings = [
    # pytest-embedded's `app_path` fixture records an XML attribute for every test.
    "ignore:record_xml_attribute is an experimental feature:pytest.PytestExperimentalApiWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["esp32tl", "tests"]

# pytest-embedded, pytest-timeout and esptool ship no py.typed; their annotations are still worth
# checking against. The NVS generator is also untyped; esp32tl calls its NVS methods directly.
[[tool.mypy.overrides]]
module = ["pytest_embedded.*", "pytest_embedded_idf.*", "pytest_timeout", "esptool.*", "esp_idf_nvs_partition_gen.*"]
follow_untyped_imports = true
