name: Runtime release
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Tag created for the merged version-only commit.
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/runtime-release.yml'
      - '.github/workflows/prepare-release.yml'
      - '.github/workflows/release-on-merge.yml'
      - '.github/scripts/release-version.py'
      - '.github/workflows/publish-pypi.yml'
      - 'esp32tl/**'
      - 'runner/**'
      - 'pyproject.toml'
      - 'scripts/*runtime*'
      - 'scripts/check-release.py'
      - 'scripts/fetch-rom-elf'
      - 'tests/test_runtime.py'
      - 'tests/test_release.py'
      - 'firmware/build.sh'
      - 'Makefile'
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: runtime-release-${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false
jobs:
  change:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version_only: ${{ steps.change.outputs.version_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - id: change
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python .github/scripts/release-version.py classify "$BASE"
  package:
    needs: change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate versions before building
        env:
          REF_TYPE: ${{ inputs.release_tag != '' && 'tag' || github.ref_type }}
          REF_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          cargo = tomllib.loads(Path('runner/Cargo.toml').read_text())['package']['version']
          assert version == cargo, 'Python and runner versions must match'
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == f'v{version}', 'Tag must match package version'
          PY
      - name: Build wheel from sdist and check metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-python
          path: dist/
          if-no-files-found: error
          retention-days: 7
  firmware:
    needs: change
    if: needs.change.outputs.version_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check Docker and build smoke firmware
        run: |
          sudo systemctl start docker
          docker info
          firmware/build.sh hello_world
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-firmware
          path: firmware/hello_world/build
          if-no-files-found: error
          retention-days: 7
  runtime:
    needs: [package, firmware]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            target: linux-x86_64
          - os: macos-15
            arch: arm64
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Check native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install rustup if missing
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            [ -x "$HOME/.cargo/bin/rustup" ] ||
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - run: make setup
      - run: cd runner && cargo test --locked --release
      - uses: actions/download-artifact@v8
        with:
          name: smoke-firmware
          path: firmware/hello_world/build
      - uses: actions/download-artifact@v8
        with:
          name: release-python
          path: dist
      - name: Package runner and test the release wheel outside checkout
        run: |
          .venv/bin/python scripts/package-runtime.py
          .venv/bin/python scripts/test-wheel-runtime.py firmware/hello_world/build
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/esp32tl-runner-*
          if-no-files-found: error
          retention-days: 7
  assemble:
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify complete release and generate SHA256SUMS
        run: python scripts/check-release.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release
          path: dist/
          if-no-files-found: error
          retention-days: 7
  draft:
    if: inputs.release_tag != '' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: verified-release
          path: dist
      - name: Create draft without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$TAG" ./* --draft --verify-tag --title "$TAG" --generate-notes
