# CI (plan M0, §6). GitHub-hosted macOS runners have no Docker, so the
# validation firmware is built once, in the pinned ESP-IDF and PlatformIO
# containers in eight parallel Linux jobs, and the runner crate once per
# platform. The test jobs then run only the runner and Python: they build
# nothing.
#
# The builds reach the test jobs through the Actions cache, not as artifacts:
# artifacts count against the account's storage quota, which is full, while
# the cache has 10 GB per repository of its own. Each build job saves a tarball
# under a key it publishes as an output, and the test jobs restore that exact
# key or fail. The key is also what keeps a build from running twice: a job
# whose key is already cached builds nothing. Each key hashes its build workflow and
# the Makefile as well as the sources, so a change to how a build is made or
# packed is a new key too. A build job saves its tarball in a step of its own
# and then checks that the cache kept it: a failed save does not fail its step
# (a key it cannot reserve is a plain log line, not even a warning), so the
# build job would stay green while every test job fails on the miss.
#
# A cache entry unused for 7 days is evicted. A test job re-run on its own
# after that fails on the cache miss: re-run all jobs instead, which builds
# again. A bad tarball saved under a key stays there until it is deleted:
# `gh cache delete <key>`.
#
# Standard hosted images, pinned to OS versions rather than moving -latest
# aliases. Both platforms run while private too; hosted usage may be billed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run of the one before. On main every
# commit gets its own group and its own run: a shared group would keep at most
# one run waiting and cancel the others.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  change:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version_only: ${{ steps.change.outputs.version_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - id: change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: python .github/scripts/release-version.py classify "$BASE"

  firmware:
    needs: change
    with:
      version_only: ${{ needs.change.outputs.version_only == 'true' }}
    uses: ./.github/workflows/build-firmware.yml

  runner-linux:
    needs: change
    uses: ./.github/workflows/build-runner.yml
    with:
      platform: linux
      version_only: ${{ needs.change.outputs.version_only == 'true' }}

  runner-macos:
    needs: change
    uses: ./.github/workflows/build-runner.yml
    with:
      platform: macos
      version_only: ${{ needs.change.outputs.version_only == 'true' }}

  test-linux:
    needs: [change, firmware, runner-linux]
    uses: ./.github/workflows/test-platform.yml
    with:
      platform: linux
      version_only: ${{ needs.change.outputs.version_only == 'true' }}
      firmware-key: ${{ needs.firmware.outputs.key }}
      rom-elf-key: ${{ needs.firmware.outputs.rom-elf-key }}
      runner-key: ${{ needs.runner-linux.outputs.key }}

  test-macos:
    needs: [change, firmware, runner-macos]
    uses: ./.github/workflows/test-platform.yml
    with:
      platform: macos
      version_only: ${{ needs.change.outputs.version_only == 'true' }}
      firmware-key: ${{ needs.firmware.outputs.key }}
      rom-elf-key: ${{ needs.firmware.outputs.rom-elf-key }}
      runner-key: ${{ needs.runner-macos.outputs.key }}

  # Plan §6: two runs of one recording are identical. `make determinism` runs
  # tests/test_determinism.py twice and compares the consoles, the taps and the
  # runner's stats; a difference is printed as a diff. On Linux and one Python:
  # the claim is about two runs on one machine, not across machines.
  determinism:
    if: needs.change.outputs.version_only != 'true'
    needs: [change, firmware, runner-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check host architecture
        run: |
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64

      - uses: actions/checkout@v7

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # As in the test job.
      - uses: ./.github/actions/restore-firmware
        with:
          key: ${{ needs.firmware.outputs.key }}

      - uses: actions/cache/restore@v6
        with:
          path: build/ci/runner.tar
          key: ${{ needs.runner-linux.outputs.key }}-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v6
        with:
          path: .cache/esp-rom-elfs
          key: ${{ needs.firmware.outputs.rom-elf-key }}

      - name: Unpack and check the runner
        run: |
          tar -xf build/ci/runner.tar
          runner/target/release/esp32tl-runner --help

      - run: make PYTHON='${{ steps.python.outputs.python-path }}' .venv/.installed rom-elf

      - run: make determinism

  # Full changes run `make lint`, clippy included; version-only changes check packaging.
  # The checkout removes runner/target/,
  # so clippy checks esp32sim from scratch, without a target-directory cache.
  lint:
    needs: change
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful change classification
        env:
          RESULT: ${{ needs.change.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v7
        if: needs.change.outputs.version_only == 'true'
      - uses: actions/setup-python@v7
        if: needs.change.outputs.version_only == 'true'
        with:
          python-version: '3.11'
      - name: Check version-only package metadata
        if: needs.change.outputs.version_only == 'true'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check host architecture
        if: needs.change.outputs.version_only != 'true'
        run: |
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64

      - uses: actions/checkout@v7
        if: needs.change.outputs.version_only != 'true'

      # The oldest Python esp32tl supports, which mypy and ruff target too.
      - id: python
        if: needs.change.outputs.version_only != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # As in the runner job, which may have hit its cache and skipped this.
      - name: Install rustup if missing
        if: needs.change.outputs.version_only != 'true'
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            [ -x "$HOME/.cargo/bin/rustup" ] ||
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          fi

      - run: make PYTHON='${{ steps.python.outputs.python-path }}' lint
        if: needs.change.outputs.version_only != 'true'

  # The documentation contract (docs/guides/documentation.md): the pull request's changes must
  # update the documentation that owns them. Against the pull request's real base branch, with the
  # full history the merge base needs; a shallow checkout has no merge base. Manual dispatch
  # on bot-created version branches also runs this required check, against origin/main.
  docs:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check host architecture
        run: |
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The script needs the standard library only; this pins which Python runs it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Through the environment, not substituted into the script.
      - name: Documentation contract
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: make docs-check BASE="$BASE"
