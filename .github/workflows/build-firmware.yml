name: Build firmware
on:
  workflow_call:
    inputs:
      version_only:
        description: Exact version-only diff already validated by the caller.
        type: boolean
        default: false
    outputs:
      key:
        description: Cache key published by the build matrix.
        value: ${{ jobs.firmware.outputs.key }}
      rom-elf-key:
        description: Cache key published by the build matrix.
        value: ${{ jobs.firmware.outputs.rom-elf-key }}

permissions:
  contents: read

jobs:
  firmware:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: idf-1, family: idf, shard: "1/4"}
          - {group: idf-2, family: idf, shard: "2/4"}
          - {group: idf-3, family: idf, shard: "3/4"}
          - {group: idf-4, family: idf, shard: "4/4"}
          - {group: examples-1, family: examples, shard: "1/3"}
          - {group: examples-2, family: examples, shard: "2/3"}
          - {group: examples-3, family: examples, shard: "3/3"}
          - {group: chips-1, family: chips, shard: "1/3"}
          - {group: chips-2, family: chips, shard: "2/3"}
          - {group: chips-3, family: chips, shard: "3/3"}
          - {group: platformio, family: platformio, shard: "1/1"}
    runs-on: ubuntu-24.04
    # Why 60: "The firmware job's timeout is 60 minutes" in docs/decisions/ci.md.
    timeout-minutes: 60
    # Every matrix member publishes the same base keys; consumers add the group.
    outputs:
      key: ${{ steps.key.outputs.key }}
      rom-elf-key: ${{ steps.key.outputs.rom-elf-key }}
    steps:
      - name: Version-only change validated; native work deferred to the release
        if: inputs.version_only
        run: echo 'Only release version metadata changed; full release builds run after merge.'
      - name: Check host architecture
        if: ${{ !inputs.version_only }}
        run: |
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64

      - uses: actions/checkout@v7
        if: ${{ !inputs.version_only }}

      - uses: actions/setup-python@v7
        if: ${{ !inputs.version_only }}
        with:
          python-version: "3.11"

      # firmware/build.sh holds the IDF tag, the container digest and the
      # project each image is built from, and firmware/build-platformio.sh and
      # each platformio.ini the PlatformIO pins, so a change to any of them, or
      # to a project kept under firmware/ or examples/, is a new key. The key of
      # PlatformIO's core directory hashes only the lines that set those pins,
      # so that a change to a sketch reuses the toolchains it downloaded.
      - id: key
        if: ${{ !inputs.version_only }}
        run: |
          echo "key=firmware-${{ hashFiles('firmware/**', 'examples/**', 'Makefile', '.github/workflows/build-firmware.yml') }}" >>"$GITHUB_OUTPUT"
          echo "rom-elf-key=rom-elf-${{ hashFiles('scripts/fetch-rom-elf') }}" >>"$GITHUB_OUTPUT"
          pins=$(grep -hE '^(CONTAINER|PIOARDUINO_VERSION)=' firmware/build-platformio.sh &&
            grep -h '^platform *=' firmware/*/platformio.ini)
          echo "platformio-key=platformio-$(printf '%s\n' "$pins" | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - id: cache
        if: ${{ !inputs.version_only }}
        uses: actions/cache/restore@v6
        with:
          path: build/ci/firmware-${{ matrix.group }}.tar
          key: ${{ steps.key.outputs.key }}-${{ matrix.group }}

      # Leave room for cold container pulls, packages and project build trees.
      # These preinstalled SDKs are unused by all build groups.
      - name: Free space for firmware builds
        if: ${{ !inputs.version_only && (steps.cache.outputs.cache-hit != 'true') }}
        run: |
          df -h .
          for sdk in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup; do
            available=$(df -Pk . | awk 'NR==2 {print $4}')
            [ "$available" -lt 20971520 ] || break
            sudo rm -rf "$sdk"
          done
          df -h .

      # Docker Engine is supplied by ubuntu-24.04; start it explicitly and
      # check access as the job user (the build scripts do not use sudo).
      - name: Prepare Docker
        if: ${{ !inputs.version_only && steps.cache.outputs.cache-hit != 'true' }}
        run: |
          command -v docker
          sudo systemctl start docker
          docker info

      # PlatformIO's core directory, which build-platformio.sh mounts into its
      # container: PlatformIO Core, the platform, the framework and the
      # toolchains, about 4 GB unpacked, 2 GB in the cache.
      # Saved at the end of the job and not
      # checked, as the ROM ELF is: a miss only downloads them again. dist/
      # holds the downloaded archives and tools/ a second copy of the
      # toolchains the platform installs into packages/; a build needs
      # neither once packages/ is there.
      - name: PlatformIO's core directory
        if: ${{ !inputs.version_only && (matrix.group == 'platformio' && steps.cache.outputs.cache-hit != 'true') }}
        uses: actions/cache@v6
        with:
          path: |
            .cache/platformio
            !.cache/platformio/dist
            !.cache/platformio/tools
          key: ${{ steps.key.outputs.platformio-key }}-${{ runner.os }}-${{ runner.arch }}

      # Only what the backend reads goes into the tarball. Of an ESP-IDF
      # build, what pytest-embedded's IdfApp reads: the files at the top of
      # each build directory (flasher_args.json, the ELF, the binaries,
      # esp32tl-build.json, esp32tl-built), config/sdkconfig.json, and the
      # bootloader and partition table images. Of a PlatformIO build, the
      # binaries, firmware.elf and the two esp32tl- files at the top of
      # .pio/build/esp32dev/. The object files and PlatformIO's firmware.map
      # stay behind. Before the tarball is cached for good, every image is
      # checked for the files the tests need: the flash images
      # flasher_args.json names and the ELF project_description.json names
      # among them, or the files esp32tl.build reads of a PlatformIO build.
      - name: Build and pack the firmware group
        if: ${{ !inputs.version_only && (steps.cache.outputs.cache-hit != 'true') }}
        env:
          FIRMWARE_OUT: ""
          GROUP: ${{ matrix.family }}
          SHARD: ${{ matrix.shard }}
        run: |
          case "$GROUP" in
            idf)
              firmware/build.sh --shard "$SHARD"
              builds=(firmware/*/build)
              ;;
            platformio)
              firmware/build-platformio.sh
              builds=(firmware/*/.pio/build/esp32dev)
              ;;
            examples)
              firmware/build.sh --examples --shard "$SHARD"
              builds=(examples/*/build)
              ;;
            chips)
              firmware/build.sh --chips --shard "$SHARD"
              builds=(firmware/*/build-*)
              ;;
          esac
          mkdir -p build/ci
          {
            for build in "${builds[@]}"; do
              if [ "$GROUP" = platformio ]; then
                find "$build" -maxdepth 1 -type f \
                  \( -name '*.bin' -o -name firmware.elf -o -name 'esp32tl-*' \)
              else
                find "$build" -maxdepth 1 -type f
                find "$build/config" -maxdepth 1 -name sdkconfig.json
                find "$build/bootloader" "$build/partition_table" -maxdepth 1 \
                  -type f \( -name '*.bin' -o -name '*.elf' \)
              fi
            done
          } >build/ci/firmware.list
          python3 - build/ci/firmware.list "${builds[@]}" <<'EOF'
          import json, sys
          from pathlib import Path

          listed = set(Path(sys.argv[1]).read_text().splitlines())
          missing = []
          for build in sys.argv[2:]:
              needed = ["esp32tl-built", "esp32tl-build.json"]
              if "/.pio/build/" in build:
                  needed += ["firmware.bin", "firmware.factory.bin", "firmware.elf"]
                  needed += ["bootloader.bin", "partitions.bin"]
              else:
                  flasher_args = json.loads(Path(build, "flasher_args.json").read_text())
                  description = json.loads(Path(build, "project_description.json").read_text())
                  needed += ["flasher_args.json", "config/sdkconfig.json"]
                  needed += [*flasher_args["flash_files"].values()]
                  needed += ["project_description.json", description["app_elf"]]
              missing += [f"{build}/{f}" for f in needed if f"{build}/{f}" not in listed]
          for path in missing:
              print(f"::error::{path} is missing from the tarball")
          sys.exit(1 if missing else 0)
          EOF
          tar -cf build/ci/firmware-${{ matrix.group }}.tar -T build/ci/firmware.list

      - run: tar -tvf build/ci/firmware-${{ matrix.group }}.tar
        if: ${{ !inputs.version_only }}

      # A failed save does not fail this step, so the next one fails the job
      # when the cache did not keep the tarball, rather than the test jobs.
      - name: Save the tarball
        if: ${{ !inputs.version_only && (steps.cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v6
        with:
          path: build/ci/firmware-${{ matrix.group }}.tar
          key: ${{ steps.key.outputs.key }}-${{ matrix.group }}

      - name: Check that the cache kept the tarball
        if: ${{ !inputs.version_only && (steps.cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/restore@v6
        with:
          path: build/ci/firmware-${{ matrix.group }}.tar
          key: ${{ steps.key.outputs.key }}-${{ matrix.group }}
          lookup-only: true
          fail-on-cache-miss: true

      # Fetched once here rather than by all the test jobs at the same time.
      # Saved at the end of the job and not checked: a miss in the test jobs
      # only downloads the ELF.
      - uses: actions/cache@v6
        if: ${{ !inputs.version_only && (matrix.group == 'idf-1') }}
        with:
          path: .cache/esp-rom-elfs
          key: ${{ steps.key.outputs.rom-elf-key }}

      - run: make rom-elf
        if: ${{ !inputs.version_only && (matrix.group == 'idf-1') }}
