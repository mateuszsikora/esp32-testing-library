name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: New MAJOR.MINOR.PATCH version, without v (for example 0.1.1).
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Update the three version fields
        env:
          VERSION: ${{ inputs.version }}
        run: python .github/scripts/release-version.py bump "$VERSION"
      - name: Check the documentation contract before pushing
        run: make docs-check BASE=HEAD
      - name: Create the version pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="build/release-$VERSION"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml runner/Cargo.toml runner/Cargo.lock
          git commit -m "build: prepare release $VERSION"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/release-pr.md" <<'EOF'
          Bump Python, runner and lockfile versions together.

          ## Documentation

          - [x] `make docs-check BASE=HEAD` passed before pushing.
          - [x] Only package version metadata changed; no behavior documentation is needed.

          ## Verification

          The Prepare release workflow validated all three versions and, in its last step, approves this pull request's CI and Runtime release runs; if that step failed, approve them under Actions. CI will validate the diff and package metadata before merge. Merging this exact version-only change starts the native release builds; publishing the resulting draft remains manual.
          EOF
          gh pr create --base main --head "$branch" --title "build: prepare release $VERSION" \
            --body-file "$RUNNER_TEMP/release-pr.md" --label area:ci
      - name: Approve the pull request's workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pull request opened with GITHUB_TOKEN starts its pull_request runs in an
          # approval-required state, and the required checks wait with them. A run dispatched on
          # the branch does not count: its checks are not the pull request's.
          # Both workflows run on this pull request: Runtime release's paths cover pyproject.toml
          # and runner/.
          head=$(git rev-parse HEAD)
          runs="repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$head"
          expected=(CI 'Runtime release')
          missing=("${expected[@]}")
          for _ in $(seq 24); do
            sleep 5
            gh api "$runs" --jq '.workflow_runs[] | [.id, .name, .conclusion // ""] | @tsv' > "$RUNNER_TEMP/runs.tsv" || continue
            missing=()
            for name in "${expected[@]}"; do
              cut -f2 "$RUNNER_TEMP/runs.tsv" | grep -qxF "$name" || missing+=("$name")
            done
            [ "${#missing[@]}" -eq 0 ] && break
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::No $name run started for $head in two minutes; approve it with Approve workflows to run on the pull request once it appears."
            done
            exit 1
          fi
          waiting=0
          failed=0
          while IFS=$'\t' read -r id name conclusion; do
            [ "$conclusion" = action_required ] || continue
            waiting=$((waiting + 1))
            if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" > /dev/null; then
              echo "Approved $name run $id"
            else
              echo "::error::Could not approve $name run $id; approve it under Actions or with: gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
              failed=1
            fi
          done < "$RUNNER_TEMP/runs.tsv"
          [ "$waiting" -gt 0 ] || echo "No pull_request run of $head waits for approval."
          exit "$failed"
