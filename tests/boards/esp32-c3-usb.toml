# An ESP32-C3 board without a USB-to-UART bridge: its console is the chip's USB-Serial/JTAG
# controller, as firmware/console_repl_usb has it. With it UART0 is free, and `uart.uart0` on its
# IO MUX pins, GPIO 21 (TX) and 20 (RX), shows what the ROM prints there.
name = "esp32-c3-usb"
chip = "esp32c3"
console = "usb-serial-jtag"

[uart.uart0]
port = 0
tx = 21
rx = 20
baud = 115200
