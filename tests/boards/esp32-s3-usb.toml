# An ESP32-S3 board without a USB-to-UART bridge: its console is the chip's USB-Serial/JTAG
# controller, as firmware/console_repl_usb has it. With it UART0 is free, and `uart.uart0` on its
# IO MUX pins, GPIO 43 (TX) and 44 (RX), shows what the ROM prints there.
name = "esp32-s3-usb"
chip = "esp32s3"
console = "usb-serial-jtag"

[uart.uart0]
port = 0
tx = 43
rx = 44
baud = 115200
